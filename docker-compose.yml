services:
  db:
    image: postgis/postgis:16-3.4
    container_name: crisisgrid-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crisisgrid}
      POSTGRES_USER: ${POSTGRES_USER:-crisisgrid_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - crisisgrid_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  crisisgrid_postgres_data:

